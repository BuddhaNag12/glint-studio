name: Release

# Builds the installers into a draft GitHub release. Usually started by "Release on merge" when main gets a
# new version; pushing a tag like v0.1.0 by hand (matching tauri.conf.json) works too.
# Check the draft, then publish it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The tag to build
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple Silicon), os: macos-latest, target: aarch64-apple-darwin }
          - { name: macOS (Intel), os: macos-latest, target: x86_64-apple-darwin }
          - { name: Windows, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: Linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: The tag matches the app version
        if: github.ref_type == 'tag' || inputs.ref
        shell: bash
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG doesn't match version $version"; exit 1; }
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
        working-directory: apps/desktop
      # shortcut: unsigned for now (macOS asks to right-click → Open, Windows shows SmartScreen); add the Apple
      # notarization and SignPath secrets here once the accounts exist.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          tagName: v__VERSION__
          releaseName: Glint Studio __VERSION__
          releaseDraft: true
          # The version can't say "alpha" (Windows MSI takes numbers only), so GitHub's pre-release flag does. Set false for 1.0.
          prerelease: true
          releaseBody: |
            Download the installer for your computer below.

            These builds aren't signed yet:
            - **macOS:** the first time, right-click Glint Studio in Applications and choose Open.
            - **Windows:** if SmartScreen appears, choose More info → Run anyway.

            On first launch Glint Studio downloads Python and what it needs, then suggests models for your computer.
